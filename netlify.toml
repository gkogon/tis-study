# Netlify deploy previews for pull requests.
#
# Production is NOT served by Netlify (the Railway "web" service serves
# simpleimpactstudies.com). This file exists so the per-PR Netlify preview
# actually builds and serves the SPA — before it, every preview URL
# returned 404 for every path — so a change can be eyeballed before merge.
#
# The preview has no backend of its own: API calls are proxied to
# production for the public, read-only endpoints the pages use (regions,
# land uses, roads, signals, live incidents). Anything that needs a
# session will 401 on a preview; that is expected.

[build]
  # pnpm is picked up from the root packageManager field; Netlify runs the
  # install itself before this command.
  command = "pnpm -C artifacts/atlanta-tis build"
  publish = "artifacts/atlanta-tis/dist/public"

[build.environment]
  NODE_VERSION = "22"
  PNPM_FLAGS = "--frozen-lockfile"

[[redirects]]
  from = "/tis-api/*"
  to = "https://simpleimpactstudies.com/tis-api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://simpleimpactstudies.com/api/:splat"
  status = 200
  force = true

# Single-page app: every other path renders index.html and the client router takes over.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
