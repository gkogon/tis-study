# CI for the node check-script suite.
#
# Runs every "check:*" script in artifacts/tis-api-server and
# artifacts/api-server on pull requests (and pushes to main, so direct
# pushes are covered too). Script names are read from each package.json
# at run time, so new check scripts are picked up without editing this
# file.
#
# The scripts run with plain node (Node 26 strips the .ts imports),
# need only `pnpm install`, and are fail-soft about DATABASE_URL, so no
# database service is required. Each exits nonzero on failure. The loop
# below keeps going past failures and reports the full list at the end.

name: checks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # No version given: reads pnpm@x from the root packageManager field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run check scripts
        run: |
          failed=()
          total=0
          for dir in artifacts/tis-api-server artifacts/api-server; do
            dir_count=0
            while IFS= read -r s; do
              dir_count=$((dir_count + 1))
              total=$((total + 1))
              echo "::group::$dir  $s"
              if ! pnpm -C "$dir" run "$s"; then
                failed+=("$dir  $s")
                echo "::error::$dir $s failed"
              fi
              echo "::endgroup::"
            done < <(jq -r '.scripts | keys_unsorted[] | select(startswith("check:"))' "$dir/package.json")
            if [ "$dir_count" -eq 0 ]; then
              echo "::error::No check:* scripts found in $dir/package.json — the suite would silently run nothing"
              exit 1
            fi
          done

          {
            echo "## Check scripts: $((total - ${#failed[@]}))/$total passed"
            for f in "${failed[@]}"; do echo "- ❌ $f"; done
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${#failed[@]}" -gt 0 ]; then
            echo "${#failed[@]} of $total check scripts failed:"
            printf ' - %s\n' "${failed[@]}"
            exit 1
          fi
          echo "All $total check scripts passed"
