openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: TIS (Traffic Impact Study) API specification — engineering-firm product surface.
servers:
  - url: /tis-api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: tis
    description: Traffic Impact Study generation
  - name: leads
    description: Demo / trial-request lead capture
  - name: auth
    description: Browser authentication endpoints
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /generate:
    post:
      operationId: generateTis
      tags: [tis]
      summary: Generate a screening-level Traffic Impact Study (TIS) for a candidate site
      description: |
        Given a candidate development site (lat/lon + land-use code + size),
        estimates trip generation using public-source rates (SANDAG 2002 /
        FHWA NHTS 2017 / NCHRP 716 — no licensed-manual data),
        finds affected signalized intersections within the study radius,
        runs a Webster-style capacity analysis combining each signal's existing
        peak-hour stress with the assigned new trips, and recommends mitigations
        sized to the projected LOS impact.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TisRequest"
      responses:
        "200":
          description: TIS report bundle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TisReport"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /utdf/parse:
    post:
      operationId: parseUtdfFile
      tags: [tis]
      summary: Parse a Synchro UTDF file into structured intersections
      description: |
        Accepts the raw text of a UTDF (Universal Traffic Data Format) file —
        the export Synchro produces via File → Transfer → Write UTDF — and
        returns the parsed nodes, per-movement volume/lane/timing counts, and
        any sections the parser skipped (named, never silent). Both known
        layouts parse: the row layout this API's own UTDF export writes, and
        Synchro's RECORDNAME matrix layout. The parsed node coordinates are
        directly usable as additionalStudyPoints on a TIS request, so an
        engineer's existing Synchro network defines the study scope.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UtdfParseRequest"
      responses:
        "200":
          description: Parsed UTDF summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UtdfParseResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /land-uses:
    get:
      operationId: listTisLandUses
      tags: [tis]
      summary: ITE land-use catalog supported by the TIS generator
      responses:
        "200":
          description: Available ITE land uses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TisLandUse"
  /auth/user:
    get:
      operationId: getCurrentAuthUser
      tags: [auth]
      summary: Get the currently authenticated user
      responses:
        "200":
          description: Auth state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
  /login:
    get:
      operationId: beginBrowserLogin
      tags: [auth]
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the OIDC authorization endpoint
  /callback:
    get:
      operationId: handleBrowserLoginCallback
      tags: [auth]
      summary: OIDC callback
      responses:
        "302":
          description: Redirect after login
  /logout:
    get:
      operationId: logoutBrowserSession
      tags: [auth]
      summary: Clear session and end OIDC login
      responses:
        "302":
          description: Redirect to OIDC end-session endpoint
  /leads/list:
    get:
      operationId: listLeadsAdmin
      tags: [leads]
      summary: List captured leads (admin allow-list only)
      responses:
        "200":
          description: Leads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeadRecord"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /projects:
    get:
      operationId: listTisProjects
      tags: [tis]
      summary: List the authenticated user's saved TIS projects (most recent first)
      responses:
        "200":
          description: Project list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TisProjectSummary"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /projects/{id}:
    get:
      operationId: getTisProject
      tags: [tis]
      summary: Fetch a single saved TIS project (full request + report)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Project detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TisProjectDetail"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /leads:
    post:
      operationId: createLead
      tags: [leads]
      summary: Capture a "Request a demo" / trial-request lead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadInput"
      responses:
        "201":
          description: Lead captured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadCreated"
        "400":
          description: Invalid lead payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [ok]
      required: [status]
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, "null"]
        firstName:
          type: [string, "null"]
        lastName:
          type: [string, "null"]
        profileImageUrl:
          type: [string, "null"]
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
    LeadRecord:
      type: object
      required: [id, name, email, organization, city, source, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        organization:
          type: string
        city:
          type: string
        role:
          type: [string, "null"]
        message:
          type: [string, "null"]
        productInterest:
          type: [string, "null"]
        source:
          type: string
        createdAt:
          type: string
          format: date-time
    LeadInput:
      type: object
      properties:
        website:
          type: string
          maxLength: 200
          description: Honeypot — must be empty.
        name:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 320
        organization:
          type: string
          minLength: 1
          maxLength: 200
          description: City, agency, firm, or company name.
        city:
          type: string
          minLength: 1
          maxLength: 120
          description: City the lead represents (often equals organization for municipal leads).
        role:
          type: string
          maxLength: 200
        message:
          type: string
          maxLength: 4000
        productInterest:
          type: string
          maxLength: 80
          description: Free-form tag — typically a tier name or "tis".
        source:
          type: string
          enum: [pricing_page, for_firms_page, trial_request, other]
      required: [name, email, organization, city]
    LeadCreated:
      type: object
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, createdAt]
    TisAnalysisPeriod:
      type: string
      enum: [am_peak, pm_peak, saturday_midday, daily]
    TisWeather:
      type: string
      enum: [clear, light_rain, heavy_rain, light_snow, heavy_snow]
    TisDistributionMethod:
      type: string
      enum: [gravity, analogy, surrogate]
      description: >-
        Directional trip-distribution method. gravity = mass/distance or
        gamma-friction gravity model; analogy = analogous-site distribution
        (PR2); surrogate = market-area (pop+emp+volume) distribution (PR3).
        Defaults to gravity.
    TisTripDistributionZone:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        distanceMi: { type: number }
        bearingDeg: { type: number }
        cardinal: { type: string }
        mass: { type: number }
        term: { type: number }
        weight: { type: number }
        sharePct: { type: number }
      required: [id, name, distanceMi, bearingDeg, cardinal, mass, term, weight, sharePct]
    TisTripDistribution:
      type: object
      description: Region-agnostic trip-distribution summary for the study.
      properties:
        method: { $ref: "#/components/schemas/TisDistributionMethod" }
        methodLabel: { type: string }
        basis: { type: string }
        betaExponent: { type: number }
        massBasis: { type: string }
        weights:
          type: array
          items: { type: number }
        loadMultipliers:
          type: array
          items: { type: number }
        byDirection:
          type: object
          additionalProperties: { type: number }
        sectors:
          type: object
          additionalProperties: { type: number }
        zones:
          type: array
          items: { $ref: "#/components/schemas/TisTripDistributionZone" }
      required: [method, methodLabel, basis, betaExponent, massBasis, weights, loadMultipliers, byDirection, sectors, zones]
    TisDirection:
      type: string
      enum: [NB, SB, EB, WB]
    UtdfParseRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 2000000
          description: Raw UTDF file text (client reads the file; no multipart).
    UtdfMovementValues:
      type: object
      description: >-
        Per-movement numeric values keyed by the twelve standard Synchro
        movements (U-turns are folded into the corresponding left by the
        parser). Used for turning-movement volumes (vph) and for turn-bay
        storage lengths (ft); a movement absent from the source file is simply
        omitted.
      properties:
        NBL: { type: number, minimum: 0 }
        NBT: { type: number, minimum: 0 }
        NBR: { type: number, minimum: 0 }
        SBL: { type: number, minimum: 0 }
        SBT: { type: number, minimum: 0 }
        SBR: { type: number, minimum: 0 }
        EBL: { type: number, minimum: 0 }
        EBT: { type: number, minimum: 0 }
        EBR: { type: number, minimum: 0 }
        WBL: { type: number, minimum: 0 }
        WBT: { type: number, minimum: 0 }
        WBR: { type: number, minimum: 0 }
    UtdfIntersectionData:
      type: object
      description: >-
        Measured data for ONE intersection imported from a Synchro UTDF file —
        the structured record the /utdf/parse endpoint emits and a TIS request
        attaches as `utdfIntersections`. Coordinates are rounded to 4 decimals
        (~11 m), well inside the ~0.35-mi study-point snap, so the engine
        re-matches each record to the same inventory signal the imported study
        point snapped to. Raw UTDF text is deliberately NOT carried on the
        generate request (reports echo the request into stored payloads).
      required: [latitude, longitude, volumes]
      properties:
        intId:
          type: integer
          description: Synchro INTID from the source file (provenance only).
        name: { type: string }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        volumes:
          $ref: "#/components/schemas/UtdfMovementValues"
        phf:
          type: number
          minimum: 0.25
          maximum: 1
          description: >-
            Representative peak-hour factor (volume-weighted mean of the file's
            per-movement PHF records). Carried for provenance/auditability; the
            screening capacity model has no PHF input today.
        hvPct:
          type: number
          minimum: 0
          maximum: 100
          description: >-
            Representative heavy-vehicle % (volume-weighted mean of the file's
            per-movement records). Carried for provenance/auditability; the
            screening capacity model has no heavy-vehicle input today.
        storageFt:
          $ref: "#/components/schemas/UtdfMovementValues"
        cycleLenSec:
          type: number
          minimum: 30
          maximum: 300
          description: >-
            Signal cycle length (s) from the file's [Timings] section. Feeds
            the Webster uniform-delay term for this intersection in place of
            the 90 s screening default.
    UtdfParseResult:
      type: object
      required: [nodes, volumeIntersections, laneIntersections, timingIntersections, warnings]
      properties:
        nodes:
          type: array
          items:
            type: object
            required: [intId, name]
            properties:
              intId: { type: integer }
              name: { type: string }
              latitude: { type: number }
              longitude: { type: number }
              # True when a [Volumes] record exists for this node — the signal
              # the engineer actually modeled, vs. geometry-only entries.
              hasVolumes: { type: boolean }
        volumeIntersections: { type: integer }
        laneIntersections: { type: integer }
        timingIntersections: { type: integer }
        # Ready-to-attach measured records: one per node that carries BOTH
        # lat/lon coordinates and a [Volumes] record, coordinates rounded to
        # 4 decimals to line up with the client's additionalStudyPoints merge.
        # The client forwards these verbatim as TisRequest.utdfIntersections.
        utdfIntersections:
          type: array
          items: { $ref: "#/components/schemas/UtdfIntersectionData" }
        warnings:
          type: array
          items: { type: string }
    TisLandUse:
      type: object
      description: >-
        One land-use entry supported by the TIS generator. Rates are derived
        from free public sources (SANDAG 2002 / FHWA NHTS 2017 / NCHRP 716);
        the land-use code follows the numbering convention the industry shares,
        but the rates are NOT reproduced from any licensed manual.
      properties:
        code: { type: string }
        name: { type: string }
        unit: { type: string }
        unitShort: { type: string }
        dailyRate: { type: number }
        amRate: { type: number }
        pmRate: { type: number }
        amDirectionalIn: { type: number }
        satMultiplier: { type: number }
        passByPctPm: { type: number }
        internalCapturePctPm: { type: number }
        # Provenance, so the picker can show where a rate came from before the
        # engineer commits to it — same auditability goal as the report's
        # "Rate source" row.
        confidence: { type: string, enum: [nhts_2017, sandag_2002, nchrp_716, blended_mpo, interpolated] }
        source: { type: string }
      required: [code, name, unit, unitShort, dailyRate, amRate, pmRate]
    DrivewayAccessType:
      type: string
      enum: [full, riro, three_quarter, entrance_only, exit_only, custom]
      description: >-
        Preset access type. All except "custom" expand server-side to a fixed
        movements set; "custom" uses the movements object verbatim.
    DrivewayMovements:
      type: object
      description: Allowed turning movements, relative to the fronting street.
      required: [inLeft, inRight, outLeft, outRight]
      properties:
        inLeft:  { type: boolean, description: Left turn into the site }
        inRight: { type: boolean, description: Right turn into the site }
        outLeft: { type: boolean, description: Left turn out onto the street }
        outRight: { type: boolean, description: Right turn out onto the street }
    Driveway:
      type: object
      required: [id, latitude, longitude, accessType, movements]
      properties:
        id: { type: string, minLength: 1 }
        latitude:  { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        label: { type: string }
        accessType: { $ref: '#/components/schemas/DrivewayAccessType' }
        movements: { $ref: '#/components/schemas/DrivewayMovements' }
    TisRequest:
      type: object
      properties:
        projectName: { type: string, minLength: 1 }
        address: { type: string }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        landUseCode: { type: string, minLength: 2 }
        size: { type: number, minimum: 0.01 }
        openingYear: { type: integer, minimum: 2024, maximum: 2050 }
        studyRadiusMi: { type: number, minimum: 0.1, maximum: 6.5 }
        analysisPeriods:
          type: array
          items: { $ref: "#/components/schemas/TisAnalysisPeriod" }
          description: Defaults to all four periods if omitted.
        growthRatePct:
          type: number
          minimum: 0
          maximum: 6
          description: Annual background growth rate applied to existing volumes (default 1.5%/yr).
        weather:
          $ref: "#/components/schemas/TisWeather"
        passByPct:
          type: number
          minimum: 0
          maximum: 70
          description: Override the land-use default pass-by % at the PM peak.
        internalCapturePct:
          type: number
          minimum: 0
          maximum: 50
          description: Override the land-use default internal-capture % at the PM peak.
        runSensitivity:
          type: boolean
          description: If true, runs a 100-iteration Monte-Carlo sensitivity analysis.
        independentVariable:
          type: string
          description: >-
            Optional ITE TGM 11th Ed. alternate independent variable (matches a
            `unitShort` from the land use's `secondaryVariables`). Defaults to the
            primary published variable.
        tripProfile:
          $ref: "#/components/schemas/TisTripProfile"
        scopeStudyIntersections:
          type: boolean
          description: >-
            When true, trim the study to the MTIASD materially-impacted set
            (nearest-few site-adjacent intersections plus any carrying >=8
            PM-peak project trips, capped). Default false: analyze EVERY
            signalized intersection within the study radius — the radius is the
            stated study scope. Shorten a report with a smaller radius, not by
            scoping within it.
        studyIntersectionIds:
          type: array
          maxItems: 60
          items: { type: string, minLength: 1 }
          description: >-
            Analyzer signal IDs to force-include as study intersections
            regardless of studyRadiusMi — a reviewer's agreed corridor scope
            (e.g. an arterial's signals spanning beyond a default 0.5-mi
            radius). Purely additive: unioned with the radius set, never removes
            a signal the radius found, and protected from the
            scopeStudyIntersections trim. Unknown IDs are ignored.
        additionalStudyPoints:
          type: array
          maxItems: 60
          description: >-
            Reviewer-scoped intersection coordinates (pasted or map-clicked),
            each snapped to the nearest inventory signal within ~0.35 mi and
            force-included regardless of studyRadiusMi. Additive, like
            studyIntersectionIds; robust when a signal's name is unknown. Points
            with no nearby signal are ignored.
          items:
            type: object
            required: [latitude, longitude]
            properties:
              latitude:  { type: number, minimum: -90, maximum: 90 }
              longitude: { type: number, minimum: -180, maximum: 180 }
        utdfIntersections:
          type: array
          maxItems: 60
          items: { $ref: "#/components/schemas/UtdfIntersectionData" }
          description: >-
            Measured turning-movement data imported from a Synchro UTDF file
            (the structured records /utdf/parse emits). Each record is snapped
            server-side to the nearest study intersection within ~0.35 mi
            (nearest record wins per signal); at matched intersections the
            measured volumes replace the AADT-derived existing volumes (growth
            still applies on top, PM is the measured anchor hour and other
            periods scale by the documented period factors), turn-bay storage
            feeds the storage-adequacy comparison, and the imported cycle
            length feeds the Webster uniform-delay term. Purely additive:
            absent => output byte-identical to a study without UTDF data.
        distributionMethod:
          $ref: "#/components/schemas/TisDistributionMethod"
        existingLandUseCode:
          type: string
          minLength: 2
          description: >-
            Optional existing (prior) land use occupying the site today, for a
            redevelopment trip-generation credit. Its trips are computed the same
            way as the proposed use and subtracted, so the report shows net new
            external trips (gross − internal capture − pass-by − existing-use
            credit). Absent ⇒ greenfield behavior (no credit, unchanged output).
        existingSize:
          type: number
          minimum: 0
          description: >-
            Size of the existing land use in that use's primary unit. Required
            (and must be > 0) for the existing-use credit to apply; ignored when
            existingLandUseCode is absent.
        conservedAssignment:
          type: boolean
          description: >-
            Opt-in conserved path assignment. Project trips are routed through
            the road network to cordon gateways on the study boundary (weighted
            by the printed directional distribution); each study intersection
            that resolves to a network junction gets its turning movements AND
            approach loading from the actual paths through it, so flow is
            conserved between adjacent resolved intersections. Changes v/c,
            delay and LOS at resolved intersections. Absent/false = legacy
            behavior, byte-identical output.
        driveways:
          type: array
          maxItems: 12
          description: >-
            Site access points with per-movement turn restrictions. When present,
            project trips route through these driveways and forbidden movements
            reroute onto the network. Absent ⇒ single-site behavior (unchanged).
          items: { $ref: '#/components/schemas/Driveway' }
      required: [projectName, address, latitude, longitude, landUseCode, size, openingYear]
    TisTripProfile:
      type: object
      description: >-
        Optional consultant-supplied within-day arrival/departure distribution
        that overrides the engine's default office distribution for the
        inbound/outbound-by-start-time and on-site-accumulation charts. Each
        array holds 24 non-negative values (clock hours 0–23); the renderer
        normalises each to sum to 1, so only relative magnitudes matter.
        Supplying this also unlocks the figures for non-office use classes.
      properties:
        arrivals:
          type: array
          items: { type: number, minimum: 0 }
          minItems: 24
          maxItems: 24
          description: Relative inbound (arrival) volume in each clock hour 0–23.
        departures:
          type: array
          items: { type: number, minimum: 0 }
          minItems: 24
          maxItems: 24
          description: Relative outbound (departure) volume in each clock hour 0–23.
        source:
          type: string
          description: Provenance label printed under the figures.
      required: [arrivals, departures]
    TisTripGeneration:
      type: object
      properties:
        landUseCode: { type: string }
        landUseName: { type: string }
        size: { type: number }
        unit: { type: string }
        unitShort: { type: string }
        variableConfidence: { type: string, enum: [nhts_2017, sandag_2002, nchrp_716, blended_mpo, interpolated] }
        variableNote: { type: string }
        # Applied rates + citation, so a reviewing PE can audit rate × size ≈
        # trips rather than taking the totals on faith. Optional: payloads
        # stored before these shipped must still parse and re-render.
        dailyRate: { type: number }
        amRate: { type: number }
        pmRate: { type: number }
        variableSource: { type: string }
        dailyTrips: { type: integer }
        amPeakTrips: { type: integer }
        pmPeakTrips: { type: integer }
        pmIn: { type: integer }
        pmOut: { type: integer }
        # Existing (prior) land-use redevelopment credit — present only when the
        # request supplied existingLandUseCode. All optional so greenfield runs
        # are unchanged.
        existingLandUseCode: { type: string }
        existingLandUseName: { type: string }
        existingSize: { type: number }
        existingUnit: { type: string }
        existingUseCreditPm: { type: integer }
        netNewExternalPm: { type: integer }
      required: [landUseCode, landUseName, size, unit, dailyTrips, amPeakTrips, pmPeakTrips, pmIn, pmOut]
    TisApproachImpact:
      type: object
      properties:
        direction: { $ref: "#/components/schemas/TisDirection" }
        existingVolumeVph: { type: number }
        addedTripsPeak: { type: integer }
        futureVolumeVph: { type: number }
        existingVc: { type: number }
        futureVc: { type: number }
        existingDelaySec: { type: number }
        futureDelaySec: { type: number }
        existingLos: { type: string, enum: [A, B, C, D, E, F] }
        futureLos: { type: string, enum: [A, B, C, D, E, F] }
        queue95thFt: { type: number }
        # True current-year baseline for this approach (no growth). Optional.
        currentVolumeVph: { type: number }
        currentVc: { type: number }
        currentDelaySec: { type: number }
        currentLos: { type: string, enum: [A, B, C, D, E, F] }
      required:
        - direction
        - existingVolumeVph
        - addedTripsPeak
        - futureVolumeVph
        - existingVc
        - futureVc
        - existingDelaySec
        - futureDelaySec
        - existingLos
        - futureLos
        - queue95thFt
    TisAffectedIntersection:
      type: object
      properties:
        signalId: { type: string }
        name: { type: string }
        zone: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        distanceMi: { type: number }
        existingVc: { type: number }
        addedTripsPmPeak: { type: integer }
        futureVc: { type: number }
        existingDelaySec: { type: number }
        futureDelaySec: { type: number }
        existingLos:
          type: string
          enum: [A, B, C, D, E, F]
        futureLos:
          type: string
          enum: [A, B, C, D, E, F]
        # True current-year baseline (existing volumes, no growth). Optional so
        # pre-scenario-refactor saved payloads still validate. These were being
        # silently stripped at the response boundary, which (a) collapsed the
        # "Existing" scenario column to No-Build values and (b) forced every
        # design-year 4-scenario table to fall back to the 3-scenario table.
        currentVc: { type: number }
        currentDelaySec: { type: number }
        currentLos:
          type: string
          enum: [A, B, C, D, E, F]
        # Design-year (long-range) No-Build and Build scenarios. Optional.
        designNoBuildVc: { type: number }
        designNoBuildDelaySec: { type: number }
        designNoBuildLos:
          type: string
          enum: [A, B, C, D, E, F]
        designBuildVc: { type: number }
        designBuildDelaySec: { type: number }
        designBuildLos:
          type: string
          enum: [A, B, C, D, E, F]
        losChanged: { type: boolean }
        mitigation: { type: string }
        mitigationSeverity:
          type: string
          enum: [none, minor, moderate, major]
        approaches:
          type: array
          items: { $ref: "#/components/schemas/TisApproachImpact" }
        queue95thFt: { type: number }
        calibration:
          $ref: "#/components/schemas/TisIntersectionCalibration"
        # Turbo-lane (continuous-green-T) screening result, present only for
        # genuine 3-leg T candidates. Passthrough object — the renderer reads
        # its fields directly; typing it fully here isn't necessary and it was
        # previously being stripped (dropping the turbo-lane appendix).
        turboLane:
          type: object
          additionalProperties: true
        # Per-turning-movement breakdown of the added project trips (NB-L/T/R…),
        # derived from the directional trip distribution + the site's bearing
        # from this intersection. Integer trips cross-foot with addedTripsPmPeak.
        movementSource:
          type: string
          enum: [path, octant]
          description: >-
            Where the movements table came from. "path" = derived from the
            routed paths through this junction (conserved assignment); "octant"
            = the geometric octant model. Absent on pre-flag payloads.
        movements:
          type: array
          items:
            type: object
            properties:
              approach:
                type: string
                enum: [NB, SB, EB, WB]
              movement:
                type: string
                enum: [L, T, R]
              trips: { type: integer }
            required: [approach, movement, trips]
        # Provenance of the EXISTING volumes at this intersection. "utdf_tmc"
        # = measured turning-movement counts imported from the engineer's
        # Synchro (UTDF) model replaced the AADT-derived design-hour estimate
        # (background growth still applied on top; the measurement anchors the
        # PM peak and other periods scale by the period factors). Absent =
        # AADT-derived estimate (legacy behavior, byte-identical payloads).
        volumeSource:
          type: string
          enum: [utdf_tmc]
        # Field-measured existing turn-bay storage (ft) for the governing
        # movement, imported from the UTDF [Lanes] Storage record — activates
        # the storage-bay-adequacy comparison the renderers already gate on
        # this field. `storageMovement` names the governing movement (e.g.
        # "NBL"). Absent on non-UTDF studies (fallback note unchanged).
        existingStorageFt: { type: number }
        storageMovement: { type: string }
        # Cycle length (s) imported from the UTDF [Timings] section and used
        # in this intersection's Webster uniform-delay term in place of the
        # 90 s screening default. Absent when the file carried no timing.
        utdfCycleLenSec: { type: number }
      required:
        - signalId
        - name
        - zone
        - latitude
        - longitude
        - distanceMi
        - existingVc
        - addedTripsPmPeak
        - futureVc
        - existingDelaySec
        - futureDelaySec
        - existingLos
        - futureLos
        - losChanged
        - mitigation
        - mitigationSeverity
        - approaches
        - queue95thFt
    TisIntersectionCalibration:
      type: object
      description: Per-intersection calibration metadata when ground-truth observations exist for this signal.
      properties:
        sampleCount: { type: integer }
        delayMultiplier: { type: number }
        lastObservedDelaySec:
          type: number
          nullable: true
      required:
        - sampleCount
        - delayMultiplier
    TisProjectSummary:
      type: object
      description: Lightweight summary row used by the projects list page.
      properties:
        id: { type: string, format: uuid }
        projectName: { type: string }
        landUseCode: { type: string }
        siteLat: { type: string, nullable: true }
        siteLon: { type: string, nullable: true }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
      required: [id, projectName, landUseCode, version, createdAt]
    TisProjectDetail:
      type: object
      description: Full saved project — summary fields plus the original request body and the rendered TisReport result payload.
      properties:
        id: { type: string, format: uuid }
        projectName: { type: string }
        landUseCode: { type: string }
        siteLat: { type: string, nullable: true }
        siteLon: { type: string, nullable: true }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        request:
          description: The TisRequest payload that produced this report.
          oneOf:
            - $ref: "#/components/schemas/TisRequest"
            - type: object
              additionalProperties: true
        result:
          $ref: "#/components/schemas/TisReport"
      required: [id, projectName, landUseCode, version, createdAt, request, result]
    TisPeriodTripGen:
      type: object
      properties:
        period: { $ref: "#/components/schemas/TisAnalysisPeriod" }
        periodLabel: { type: string }
        rawTrips: { type: integer }
        passByCredit: { type: integer }
        internalCaptureCredit: { type: integer }
        externalTrips: { type: integer }
        inTrips: { type: integer }
        outTrips: { type: integer }
        # Redevelopment credit for this period — present only when the request
        # supplied an existing land use. externalTrips stays the proposed use's
        # external trips; netNewExternalTrips is what is actually assigned to the
        # network (externalTrips − existingUseCredit, floored at 0).
        existingUseCredit: { type: integer }
        netNewExternalTrips: { type: integer }
      required:
        - period
        - periodLabel
        - rawTrips
        - passByCredit
        - internalCaptureCredit
        - externalTrips
        - inTrips
        - outTrips
    TisPeriodReport:
      type: object
      properties:
        period: { $ref: "#/components/schemas/TisAnalysisPeriod" }
        periodLabel: { type: string }
        tripGeneration: { $ref: "#/components/schemas/TisPeriodTripGen" }
        affectedIntersections:
          type: array
          items: { $ref: "#/components/schemas/TisAffectedIntersection" }
        intersectionsWithLosDrop: { type: integer }
        intersectionsAtLosEf: { type: integer }
        worstDelayDeltaSec: { type: number }
      required:
        - period
        - periodLabel
        - tripGeneration
        - affectedIntersections
        - intersectionsWithLosDrop
        - intersectionsAtLosEf
        - worstDelayDeltaSec
    TisSensitivityResult:
      type: object
      properties:
        iterations: { type: integer }
        worstDelayDeltaMean: { type: number }
        worstDelayDeltaP10: { type: number }
        worstDelayDeltaP50: { type: number }
        worstDelayDeltaP90: { type: number }
        probAnyLosDrop: { type: number }
        probAnyLosEf: { type: number }
        expectedLosDrops: { type: number }
      required:
        - iterations
        - worstDelayDeltaMean
        - worstDelayDeltaP10
        - worstDelayDeltaP50
        - worstDelayDeltaP90
        - probAnyLosDrop
        - probAnyLosEf
        - expectedLosDrops
    DrivewayResultItem:
      type: object
      description: Per-driveway assignment summary from a driveway-routed TIS.
      required: [drivewayNode, label, enterByMovement, exitByMovement, reroutedTrips]
      properties:
        drivewayNode: { type: integer, description: Internal graph node index for the driveway snap point. }
        label: { type: string, description: Driveway label (falls back to the driveway id). }
        enterByMovement:
          type: object
          required: [inLeft, inRight]
          properties:
            inLeft:  { type: number, description: Trips entering via left turn. }
            inRight: { type: number, description: Trips entering via right turn. }
        exitByMovement:
          type: object
          required: [outLeft, outRight]
          properties:
            outLeft:  { type: number, description: Trips exiting via left turn. }
            outRight: { type: number, description: Trips exiting via right turn. }
        reroutedTrips: { type: number, description: Trips that could not leave directly and rerouted as U-turns. }
    DrivewayRouteResult:
      type: object
      description: >-
        Driveway access assignment result. Present only when `request.driveways`
        was supplied and non-empty AND a road network was available to route
        through. Absent ⇒ no driveways or roads unavailable (base LOS unchanged).
      required: [driveways, reroutes]
      properties:
        driveways:
          type: array
          items: { $ref: '#/components/schemas/DrivewayResultItem' }
        reroutes:
          type: array
          items:
            type: object
            required: [destIndex, trips]
            properties:
              destIndex: { type: integer, description: Index into the destination list (candidate intersection) where the U-turn volume was credited. }
              trips: { type: number, description: Number of trips rerouted via this U-turn. }
    TisRouteAssignment:
      type: object
      properties:
        available: { type: boolean }
        method: { type: string }
        iterations: { type: integer }
        destinationsTotal: { type: integer }
        destinationsRouted: { type: integer }
        onNetworkPct: { type: number }
        worstLinkVoverC: { type: number }
        corridors:
          type: array
          items:
            type: object
            properties:
              classLabel: { type: string }
              projectVph: { type: number }
              lengthMi: { type: number }
              vOverC: { type: number }
            required: [classLabel, projectVph, lengthMi, vOverC]
      required:
        - available
        - method
        - iterations
        - destinationsTotal
        - destinationsRouted
        - onNetworkPct
        - worstLinkVoverC
        - corridors
    TisReport:
      type: object
      properties:
        generatedAt: { type: string }
        request:
          $ref: "#/components/schemas/TisRequest"
        studyRadiusMi: { type: number }
        tripGeneration:
          $ref: "#/components/schemas/TisTripGeneration"
        affectedIntersections:
          type: array
          items:
            $ref: "#/components/schemas/TisAffectedIntersection"
        intersectionsStudied: { type: integer }
        intersectionsWithLosDrop: { type: integer }
        intersectionsAtLosEf: { type: integer }
        worstDelayDeltaSec: { type: number }
        mitigationSummary:
          type: array
          items: { type: string }
        findings:
          type: array
          items: { type: string }
        methodology:
          type: array
          items: { type: string }
        periodReports:
          type: array
          items: { $ref: "#/components/schemas/TisPeriodReport" }
        growthAppliedPct: { type: number }
        growthYears: { type: integer }
        weather: { $ref: "#/components/schemas/TisWeather" }
        weatherCapacityFactor: { type: number }
        passByPctApplied: { type: number }
        internalCapturePctApplied: { type: number }
        autoModeShareApplied: { type: number }
        routeAssignment: { $ref: "#/components/schemas/TisRouteAssignment" }
        # Present only when the request opted into conservedAssignment AND a
        # cordon could be built. Diagnostics a reviewer needs to judge the
        # method: how many intersections actually resolved to path-derived
        # movements, and the measured node-balance of the assignment.
        conservedAssignment:
          type: object
          properties:
            enabled: { type: boolean }
            gatewayCount: { type: integer }
            classCeiling: { type: integer }
            emptyOctants:
              type: array
              items: { type: string }
            resolvedIntersections: { type: integer }
            octantFallbacks: { type: integer }
            conservation:
              type: object
              properties:
                nodesChecked: { type: integer }
                maxImbalance: { type: number }
                balanced: { type: boolean }
        sensitivity: { $ref: "#/components/schemas/TisSensitivityResult" }
        tripDistribution:
          $ref: "#/components/schemas/TisTripDistribution"
        driveways: { $ref: "#/components/schemas/DrivewayRouteResult" }
        coverageNote:
          type: object
          description: >-
            Present ONLY when the study radius contained no signalized
            intersection and the engine widened to the nearest-N fallback set
            (sparse rural/exurban site). The study succeeded; this discloses
            that every analyzed intersection sits beyond the stated radius.
          properties:
            code: { type: string, enum: [nearest_n_fallback] }
            radiusMi: { type: number }
            usedCount: { type: integer }
            nearestDistanceMi: { type: number }
            farthestDistanceMi: { type: number }
            message: { type: string }
          required: [code, radiusMi, usedCount, nearestDistanceMi, farthestDistanceMi, message]
      required:
        - generatedAt
        - request
        - studyRadiusMi
        - tripGeneration
        - affectedIntersections
        - intersectionsStudied
        - intersectionsWithLosDrop
        - intersectionsAtLosEf
        - worstDelayDeltaSec
        - mitigationSummary
        - findings
        - methodology
        - periodReports
        - growthAppliedPct
        - growthYears
        - weather
        - weatherCapacityFactor
        - passByPctApplied
        - internalCapturePctApplied
